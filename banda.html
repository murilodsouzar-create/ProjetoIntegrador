<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Banda</title>

    <link rel="stylesheet" href="css/style.css">
    <style>

    </style>
</head>

<body>

    <header>

        <div class="mei">
            FORMULÁRIO DE BANDA
        </div>

    </header>


    <div class="container">

        <h1 class="titulo">
            Cadastro de Banda
        </h1>


        <form id="formBanda">

            <h2>Informações da Banda</h2>

            <label for="nomeBanda">
                Nome da banda:
            </label>

            <input type="text" id="nomeBanda" placeholder="Digite o nome da banda" required>


            <label for="genero">
                Gênero musical:
            </label>

            <select id="genero" required>

                <option value="">
                    Selecione
                </option>

                <option value="Rock">
                    Rock
                </option>

                <option value="Pop">
                    Pop
                </option>

                <option value="Metal">
                    Metal
                </option>

                <option value="Sertanejo">
                    Sertanejo
                </option>

                <option value="MPB">
                    MPB
                </option>

                <option value="Rap">
                    Rap
                </option>

                <option value="Reggae">
                    Reggae
                </option>

            </select>


            <label for="ano">
                Ano de formação:
            </label>

            <input type="number" id="ano" placeholder="Ex: 2020" required>


            <label for="cidade">
                Cidade:
            </label>

            <input type="text" id="cidade" placeholder="Cidade da banda" required>


            <h2>Integrantes</h2>

            <label for="vocalista">
                Vocalista:
            </label>

            <input type="text" id="vocalista" placeholder="Nome do vocalista" required>


            <label for="guitarrista">
                Guitarrista:
            </label>

            <input type="text" id="guitarrista" placeholder="Nome do guitarrista">


            <label for="baixista">
                Baixista:
            </label>

            <input type="text" id="baixista" placeholder="Nome do baixista">


            <label for="baterista">
                Baterista:
            </label>

            <input type="text" id="baterista" placeholder="Nome do baterista">


            <h2>Sobre a Banda</h2>

            <label for="descricao">
                Descrição:
            </label>

            <textarea id="descricao" rows="5" placeholder="Conte sobre a banda..."></textarea>


            <label for="musica">
                Música mais conhecida:
            </label>

            <input type="text" id="musica" placeholder="Nome da música">

            <div>
                <input type="checkbox" onchange="verifica(this)" id="concordo">
                <label>Concordo com os termos</label>
            </div>


            <button id="ababc" class="btn_cadastrar">
                Cadastrar Banda
            </button>

        </form>


        <div id="resultado"></div>

    </div>


    <footer class="roda">


    </footer>


    <script>
            function verifica(elemento) {
                if (elemento.checked) {
                    document.getElementById("ababc").className = "btn_cadastrar_ok"
                } else {
                    document.getElementById("ababc").className = "btn_cadastrar"
                }

            }
b
    </script>

</body>

</html
